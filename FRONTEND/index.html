<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fishing Planet - Your Fishing Equipment Store</title>

  <!-- BOOTSTRAP 5.3.2 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet" />

  <!-- TOASTR -->
  <link href="https://cdn.jsdelivr.net/npm/toastr@2.1.4/build/toastr.min.css" rel="stylesheet" />

  <!-- CUSTOM CSS -->
  <link rel="stylesheet" href="CSS/style.css" />
  <link rel="stylesheet" href="CSS/spapp.css" />
</head>

<body>

  <!-- NAVBAR -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-primary fixed-top shadow">
    <div class="container">
      <a class="navbar-brand fw-bold" href="#home">
        <i class="bi bi-water"></i> Fishing Planet
      </a>

      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link" href="#home"><i class="bi bi-house"></i> Home</a></li>
          <li class="nav-item"><a class="nav-link" href="#products"><i class="bi bi-bag"></i> Products</a></li>
          <li class="nav-item" id="aboutNav"><a class="nav-link" href="#aboutus"><i class="bi bi-info-circle"></i> About</a></li>
          
          <!-- LOGGED OUT -->
          <li class="nav-item" id="loginNav" style="display:none;">
            <a class="nav-link" href="#login"><i class="bi bi-box-arrow-in-right"></i> Login</a>
          </li>
          <li class="nav-item" id="signupNav" style="display:none;">
            <a class="nav-link" href="#signup"><i class="bi bi-person-plus"></i> Sign Up</a>
          </li>

          <!-- LOGGED IN -->
          <li class="nav-item" id="userNav" style="display:none;">
            <a class="nav-link" href="#user"><i class="bi bi-person-circle"></i> Profile</a>
          </li>
          
          <li class="nav-item" id="adminNav" style="display:none;">
            <a class="nav-link" href="#admin"><i class="bi bi-shield-check"></i> Admin</a>
          </li>

          <li class="nav-item" id="wishlistNav" style="display:none;">
            <a class="nav-link position-relative" href="#wishlist">
              <i class="bi bi-heart"></i>
              <span id="wishlist-count" class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger">0</span>
            </a>
          </li>

          <li class="nav-item" id="cartNav" style="display:none;">
            <a class="nav-link position-relative" href="#cart">
              <i class="bi bi-cart"></i>
              <span id="cart-count" class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger">0</span>
            </a>
          </li>

          <li class="nav-item" id="checkoutNav" style="display:none;">
            <a class="nav-link" href="#checkout"><i class="bi bi-credit-card"></i> Checkout</a>
          </li>

          <li class="nav-item" id="logoutNav" style="display:none;">
            <button class="btn btn-outline-light btn-sm ms-2" onclick="AuthService.logout()">
              <i class="bi bi-box-arrow-right"></i> Logout
            </button>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- MAIN SPA CONTAINER -->
  <main id="spapp" class="container-fluid mt-5 pt-3" role="main" style="padding-top: 76px;">
    <section id="home"></section>
    <section id="products"></section>
    <section id="cart"></section>
    <section id="wishlist"></section>
    <section id="checkout"></section>
    <section id="login"></section>
    <section id="signup"></section>
    <section id="user"></section>
    <section id="admin"></section>
    <section id="aboutus"></section>
  </main>

  <!-- FOOTER -->
  <footer class="bg-dark text-white text-center py-3 mt-5">
    <div class="container">
      <p class="mb-0">
        &copy; 2025 Fishing Planet <i class="bi bi-heart-fill text-danger"></i> All Rights Reserved
      </p>
    </div>
  </footer>

  <!-- ========================================
       SCRIPTS - EXACT ORDER FROM LAB 10
  ======================================== -->

  <!-- 1. jQuery -->
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

  <!-- 2. Bootstrap -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

  <!-- 3. jQuery Validate -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery-validate/1.19.5/jquery.validate.min.js"></script>

  <!-- 4. BlockUI -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery.blockUI/2.70/jquery.blockUI.min.js"></script>

  <!-- 5. Toastr -->
  <script src="https://cdn.jsdelivr.net/npm/toastr@2.1.4/build/toastr.min.js"></script>

  <!-- 6. SPApp Library -->
  <script src="JS/jquery.spapp.js"></script>

  <!-- 7. Constants -->
  <script src="JS/constants.js"></script>

  <!-- 8. Utils -->
  <script src="JS/utils.js"></script>

  <!-- 9. REST Client -->
  <script src="JS/rest-client.js"></script>

  <!-- 10. Services -->
  <script src="JS/AuthService.js"></script>
  <script src="JS/ProductService.js"></script>
  <script src="JS/CartService.js"></script>
  <script src="JS/WishlistService.js"></script>
  <script src="JS/UserService.js"></script>
  <script src="JS/AdminService.js"></script>
  <script src="JS/CheckoutService.js"></script>

  <!-- 11. Router (FROM LAB) -->
  <script src="JS/spapp.js"></script>

  <!-- 12. Global Init -->
  <script src="JS/script.js"></script>

</body>
</html>
