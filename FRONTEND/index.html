<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fishing Planet - Your Fishing Equipment Store</title>

  <!-- BOOTSTRAP -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet" />

  <!-- CUSTOM CSS -->
  <link rel="stylesheet" href="CSS/style.css" />
  <link rel="stylesheet" href="CSS/spapp.css" />

  <style>
    body { padding-top: 76px; background-color: #f8f9fa; }
    .navbar-brand { font-weight: 600; letter-spacing: 0.5px; }
    footer { background: #003366; color: white; text-align: center; padding: 15px 0; margin-top: 40px; }
  </style>
</head>

<body>

  <!-- NAVBAR -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-primary fixed-top shadow">
    <div class="container">
      <a class="navbar-brand" href="#home">
        <i class="bi bi-water"></i> Fishing Planet
      </a>

      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link" href="#home">Home</a></li>
          <li class="nav-item"><a class="nav-link" href="#products">Products</a></li>
          <li class="nav-item"><a class="nav-link" href="#aboutus">About Us</a></li>
          <li class="nav-item"><a class="nav-link" href="#checkout">Checkout</a></li>
          <li class="nav-item"><a class="nav-link" href="#login">Login</a></li>
          <li class="nav-item"><a class="nav-link" href="#user"><i class="bi bi-person"></i></a></li>

          <li class="nav-item">
            <a class="nav-link position-relative" href="#wishlist">
              <i class="bi bi-heart"></i>
              <span id="wishlist-count"
                class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger">0</span>
            </a>
          </li>

          <li class="nav-item">
            <a class="nav-link position-relative" href="#cart">
              <i class="bi bi-cart"></i>
              <span id="cart-count"
                class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger">0</span>
            </a>
          </li>

        </ul>
      </div>
    </div>
  </nav>

  <!-- ALERTS -->
  <div id="alert-container" class="container mt-3"></div>

  <!-- MAIN SPA CONTAINER -->
  <main id="spapp" class="container mt-4" role="main">

    <section id="home" data-load="HTML/home.html"></section>
    <section id="products" data-load="HTML/products.html"></section>
    <section id="single_product" data-load="HTML/single_product.html"></section>
    <section id="aboutus" data-load="HTML/aboutus.html"></section>
    <section id="cart" data-load="HTML/cart.html"></section>
    <section id="wishlist" data-load="HTML/wishlist.html"></section>
    <section id="checkout" data-load="HTML/checkout.html"></section>
    <section id="login" data-load="HTML/login.html"></section>
    <section id="signup" data-load="HTML/signup.html"></section>
    <section id="user" data-load="HTML/user.html"></section>
    <section id="admin" data-load="HTML/admin.html"></section>

  </main>

  <!-- PRODUCT IMAGE MODAL -->
  <div class="modal fade" id="imageModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered modal-lg">
      <div class="modal-content">
        <div class="modal-body text-center">
          <img id="modalImage" src="" class="img-fluid rounded" alt="Product Image">
        </div>
      </div>
    </div>
  </div>

  <!-- ADMIN EDIT PRODUCT MODAL -->
  <div class="modal fade" id="editProductModal" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header bg-success text-white">
          <h5 class="modal-title">Edit Product</h5>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
        </div>

        <div class="modal-body">
          <form id="editProductForm">
            <input type="hidden" id="editProductId">

            <div class="mb-3">
              <label class="form-label">Product Name</label>
              <input type="text" class="form-control" id="editProductName" required>
            </div>

            <div class="mb-3">
              <label class="form-label">Image URL</label>
              <input type="text" class="form-control" id="editProductImage" required>
            </div>

            <div class="mb-3">
              <label class="form-label">Price</label>
              <input type="number" step="0.01" class="form-control" id="editProductPrice" required>
            </div>

            <div class="mb-3">
              <label class="form-label">Quantity</label>
              <input type="number" class="form-control" id="editProductQuantity" required>
            </div>
          </form>
        </div>

        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
          <button type="button" class="btn btn-success" onclick="saveProductEdit()">Save</button>
        </div>

      </div>
    </div>
  </div>

  <!-- FOOTER -->
  <footer>
    <div class="container">
      <p class="mb-0">
        &copy; 2025 Fishing Planet <i class="bi bi-heart-fill text-danger"></i> 
      </p>
    </div>
  </footer>

  <!-- SCRIPTS (ORDER MATTERS) -->
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

  <!-- SPApp engine -->
  <script src="JS/jquery.spapp.js"></script>

  <!-- SPApp app router -->
  <script src="JS/spapp.js"></script>

  <!-- Your application JS (cart, wishlist, fetch, alerts...) -->
  <script src="JS/script.js"></script>

</body>
</html>
