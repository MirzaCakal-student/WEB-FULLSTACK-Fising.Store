<div class="container py-4 checkout-container">

  <h2 class="text-center mb-4 text-primary">Checkout</h2>

  <!-- ===== Progress Tracker ===== -->
  <div class="checkout-progress">
      <div class="progress-line"></div>
      <div class="step-circle active" data-step="1">1</div>
      <div class="step-circle" data-step="2">2</div>
      <div class="step-circle" data-step="3">3</div>
      <div class="step-circle" data-step="4">4</div>
  </div>


  <!-- ================= STEP 1 ================= -->
  <div id="step1" class="checkout-step active">
    <div class="card shadow-sm p-4">
      <h4 class="mb-4 text-primary"><i class="bi bi-person"></i> Personal Info</h4>

      <div class="row g-3">
        <div class="col-md-6"><input class="form-control" id="chName" placeholder="Full name"></div>
        <div class="col-md-6"><input class="form-control" id="chEmail" placeholder="Email"></div>
        <div class="col-md-6"><input class="form-control" id="chPhone" placeholder="Phone"></div>
      </div>

      <div class="mt-4 text-end">
        <button class="btn btn-primary" data-next="2">Next</button>
      </div>
    </div>
  </div>


  <!-- ================= STEP 2 ================= -->
  <div id="step2" class="checkout-step">
    <div class="card shadow-sm p-4">
      <h4 class="mb-4 text-primary"><i class="bi bi-truck"></i> Shipping Info</h4>

      <div class="row g-3">
        <div class="col-md-8"><input class="form-control" id="chAddr" placeholder="Address"></div>
        <div class="col-md-4"><input class="form-control" id="chCity" placeholder="City"></div>
        <div class="col-md-4"><input class="form-control" id="chZip" placeholder="ZIP/Postal"></div>
        <div class="col-md-4">
          <select class="form-select" id="chCountry">
            <option value="">Country</option>
            <option>Bosnia and Herzegovina</option>
            <option>Croatia</option>
            <option>Serbia</option>
            <option>Montenegro</option>
            <option>Other</option>
          </select>
        </div>
      </div>

      <div class="mt-4 d-flex justify-content-between">
        <button class="btn btn-outline-secondary" data-back="1">Back</button>
        <button class="btn btn-primary" data-next="3">Next</button>
      </div>
    </div>
  </div>


  <!-- ================= STEP 3 ================= -->
  <div id="step3" class="checkout-step">
    <div class="card shadow-sm p-4">
      <h4 class="mb-4 text-primary"><i class="bi bi-list-check"></i> Review Order</h4>

      <div class="table-responsive">
        <table class="table table-bordered align-middle">
          <thead class="table-primary">
            <tr><th>Product</th><th>Qty</th><th>Price</th><th>Total</th></tr>
          </thead>
          <tbody id="reviewTbody"></tbody>
        </table>
      </div>

      <div class="mt-4 d-flex justify-content-between">
        <button class="btn btn-outline-secondary" data-back="2">Back</button>
        <button class="btn btn-primary" data-next="4">Next</button>
      </div>
    </div>
  </div>


  <!-- ================= STEP 4 ================= -->
  <div id="step4" class="checkout-step">
    <div class="card shadow-sm p-4">
      <h4 class="mb-4 text-primary"><i class="bi bi-credit-card"></i> Payment</h4>

      <div class="mb-3">
        <div class="form-check form-check-inline">
          <input class="form-check-input" type="radio" name="payMethod" value="card" checked>
          <label class="form-check-label">Credit/Debit Card</label>
        </div>
        <div class="form-check form-check-inline">
          <input class="form-check-input" type="radio" name="payMethod" value="paypal">
          <label class="form-check-label">PayPal</label>
        </div>
      </div>

      <div id="cardFields" class="row g-3">
        <div class="col-12"><input class="form-control" placeholder="Card number (16 digits)"></div>
        <div class="col-md-6"><input class="form-control" placeholder="Card holder name"></div>
        <div class="col-md-3"><input class="form-control" placeholder="MM/YY"></div>
        <div class="col-md-3"><input class="form-control" placeholder="CVC"></div>
      </div>

      <div class="mt-4 d-flex justify-content-between">
        <button class="btn btn-outline-secondary" data-back="3">Back</button>
        <button class="btn btn-success" id="finishOrder">Pay</button>
      </div>

      <div id="payMsg" class="mt-3"></div>
    </div>
  </div>

</div>
