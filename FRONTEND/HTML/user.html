<h3>User Profile</h3>
<div id="userCard" class="card" style="max-width:680px;">
  <div class="card-body">
    <div class="d-flex align-items-center gap-3">
      <img id="userAvatar" src="https://i.pravatar.cc/120" class="rounded-circle" width="80" height="80" alt="">
      <div class="flex-grow-1">
        <div class="row g-2">
          <div class="col-md-6"><input id="uName" class="form-control" placeholder="Full name"></div>
          <div class="col-md-6"><input id="uEmail" class="form-control" placeholder="Email"></div>
        </div>
      </div>
    </div>
    <button class="btn btn-primary mt-3" id="saveUser">Save</button>
    <div id="userMsg" class="mt-2"></div>
  </div>
</div>
