<div class="container py-4 user-page">
  <div class="row justify-content-center">
    <div class="col-lg-8">

      <!-- Header card -->
      <div class="card shadow-sm mb-4 user-header-card">
        <div class="card-body d-flex align-items-center">
          <div class="user-avatar me-3">
            <i class="bi bi-person-circle"></i>
          </div>
          <div>
            <h3 class="mb-1">My Account</h3>
            <p class="text-muted mb-0">
              Manage your profile, security and account settings.
            </p>
          </div>
        </div>
      </div>

      <div class="row g-4">

        <!-- Left: profile + password -->
        <div class="col-md-7">
          <div class="card shadow-sm user-card h-100">
            <div class="card-body">
              <h5 class="card-title mb-3">Profile details</h5>

              <form id="userProfileForm">
                <!-- Name -->
                <div class="mb-3">
                  <label class="form-label">Full name</label>
                  <input type="text" class="form-control" id="userName" placeholder="Your name">
                </div>

                <!-- Email -->
                <div class="mb-3">
                  <label class="form-label">Email address</label>
                  <input type="email" class="form-control" id="userEmail" placeholder="you@example.com">
                </div>

                <hr class="my-3">

                <h6 class="text-primary mb-2">
                  <i class="bi bi-shield-lock"></i> Change password
                </h6>

                <div class="mb-3">
                  <label class="form-label">Current password</label>
                  <input type="password" class="form-control" id="currentPassword" placeholder="Enter current password">
                </div>

                <div class="row g-2">
                  <div class="col-md-6">
                    <label class="form-label">New password</label>
                    <input type="password" class="form-control" id="newPassword" placeholder="New password">
                  </div>
                  <div class="col-md-6">
                    <label class="form-label">Confirm new password</label>
                    <input type="password" class="form-control" id="confirmPassword" placeholder="Repeat new password">
                  </div>
                </div>

                <div class="mt-4 d-flex justify-content-end gap-2">
                  <button type="reset" class="btn btn-outline-secondary btn-sm">Reset</button>
                  <button type="submit" class="btn btn-primary">Save changes</button>
                </div>
              </form>
            </div>
          </div>
        </div>

        <!-- Right: session + danger zone -->
        <div class="col-md-5">

          <!-- Session -->
          <div class="card shadow-sm user-card mb-3">
            <div class="card-body">
              <h5 class="card-title mb-3">Session</h5>
              <p class="small text-muted">
                Logged in as <span id="userEmailLabel" class="fw-semibold">guest@demo.com</span>
              </p>

              <button class="btn btn-outline-primary w-100 mb-2" id="btnLogout">
                <i class="bi bi-box-arrow-right"></i> Sign out
              </button>

              <button class="btn btn-outline-secondary w-100" id="btnGoToLogin">
                <i class="bi bi-door-open"></i> Go to login page
              </button>
            </div>
          </div>

          <!-- Danger zone -->
          <div class="card shadow-sm border-danger user-card">
            <div class="card-body">
              <h5 class="card-title text-danger mb-2">
                <i class="bi bi-exclamation-triangle-fill"></i> Danger zone
              </h5>
              <p class="small text-muted mb-3">
                Once you delete your account, there is no way to recover it. All your cart
                and wishlist data will be removed.
              </p>

              <button class="btn btn-outline-danger w-100" id="btnDeleteAccount">
                <i class="bi bi-trash"></i> Delete account
              </button>
            </div>
          </div>

        </div>

      </div>
    </div>
  </div>
</div>
