<div class="auth-page">
  <div class="auth-card shadow-lg">
    <div class="auth-header text-center mb-4">
      <i class="bi bi-person-circle auth-icon"></i>
      <h2 class="auth-title">Welcome Back</h2>
      <p class="auth-subtitle">Log in to manage your Fishing Planet account.</p>
    </div>

    <form id="loginForm" novalidate>
      <div class="mb-3">
        <label for="loginEmail" class="form-label">Email</label>
        <input
          type="email"
          class="form-control"
          id="loginEmail"
          placeholder="you@example.com"
          required
        />
      </div>

      <div class="mb-3">
        <label for="loginPassword" class="form-label">Password</label>
        <input
          type="password"
          class="form-control"
          id="loginPassword"
          placeholder="••••••••"
          required
        />
      </div>

      <div class="d-flex justify-content-between align-items-center mb-3">
        <div class="form-check">
          <input class="form-check-input" type="checkbox" id="rememberMe" />
          <label class="form-check-label" for="rememberMe">
            Remember me
          </label>
        </div>
        <a href="#home" class="small auth-link">Back to store</a>
      </div>

      <button type="submit" class="btn btn-primary w-100">
        <i class="bi bi-box-arrow-in-right"></i> Log In
      </button>
    </form>

    <p class="auth-switch text-center mt-3">
      Do not have an account?
      <a href="#signup" class="auth-link">Create one</a>
    </p>
  </div>
</div>
