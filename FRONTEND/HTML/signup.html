<div class="auth-page">
  <div class="auth-card shadow-lg">
    <div class="auth-header text-center mb-4">
      <i class="bi bi-person-plus auth-icon"></i>
      <h2 class="auth-title">Create Account</h2>
      <p class="auth-subtitle">Join Fishing Planet and start building your perfect setup.</p>
    </div>

    <form id="signupForm" novalidate>
      <div class="row g-3">
        <div class="col-md-6">
          <label for="signupName" class="form-label">Name</label>
          <input
            type="text"
            class="form-control"
            id="signupName"
            placeholder="Mirza"
            required
          />
        </div>
        <div class="col-md-6">
          <label for="signupSurname" class="form-label">Surname</label>
          <input
            type="text"
            class="form-control"
            id="signupSurname"
            placeholder="Čakal"
            required
          />
        </div>
      </div>

      <div class="mt-3">
        <label for="signupEmail" class="form-label">Email</label>
        <input
          type="email"
          class="form-control"
          id="signupEmail"
          placeholder="you@example.com"
          required
        />
      </div>

      <div class="mt-3">
        <label for="signupPassword" class="form-label">Password</label>
        <input
          type="password"
          class="form-control"
          id="signupPassword"
          placeholder="Choose a strong password"
          required
        />
      </div>

      <div class="mt-3">
        <label class="form-label d-block">Gender</label>
        <div class="form-check form-check-inline">
          <input
            class="form-check-input"
            type="radio"
            name="signupGender"
            id="genderM"
            value="M"
            checked
          />
          <label class="form-check-label" for="genderM">M</label>
        </div>
        <div class="form-check form-check-inline">
          <input
            class="form-check-input"
            type="radio"
            name="signupGender"
            id="genderF"
            value="F"
          />
          <label class="form-check-label" for="genderF">F</label>
        </div>
      </div>

      <button type="submit" class="btn btn-success w-100 mt-4">
        <i class="bi bi-person-check"></i> Sign Up
      </button>
    </form>

    <p class="auth-switch text-center mt-3">
      Already have an account?
      <a href="#login" class="auth-link">Log in</a>
    </p>
  </div>
</div>
