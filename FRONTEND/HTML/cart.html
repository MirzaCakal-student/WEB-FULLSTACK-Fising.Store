<div class="cart-container container py-4">

    <h2 class="page-title text-center mb-4">Your Cart</h2>

    <!-- If empty -->
    <div id="cartEmpty" class="alert alert-info text-center" style="display:none;">
        Your cart is empty.
        <br><br>
        <a href="#products" class="btn btn-primary mt-2">Go to Products</a>
    </div>

    <!-- Cart Table -->
    <div id="cartContent" style="display:none;">
        <div class="table-responsive">
            <table class="table align-middle cart-table">
                <thead class="table-primary">
                    <tr>
                        <th>Product</th>
                        <th width="120">Qty</th>
                        <th width="120">Price</th>
                        <th width="120">Total</th>
                        <th width="80"></th>
                    </tr>
                </thead>
                <tbody id="cartBody"></tbody>
            </table>
        </div>

        <!-- Summary -->
        <div class="text-end mt-3">
            <h4 class="fw-bold">Final Total: <span id="cartFinalTotal" class="text-success">$0.00</span></h4>
        </div>

        <div class="d-flex justify-content-between mt-4">
            <a href="#products" class="btn btn-outline-secondary">Continue Shopping</a>
            <a href="#checkout" class="btn btn-primary">Proceed to Checkout</a>
        </div>
    </div>
</div>
