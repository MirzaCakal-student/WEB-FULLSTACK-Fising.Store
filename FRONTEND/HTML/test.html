<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Test</title>
    <style>
        body { font-family: Arial; max-width: 500px; margin: 50px auto; padding: 20px; }
        input, button { width: 100%; padding: 10px; margin: 10px 0; font-size: 16px; }
        .result { margin-top: 20px; padding: 15px; background: #f0f0f0; }
        .error { background: #ffdddd; color: red; }
        .success { background: #ddffdd; color: green; }
    </style>
</head>
<body>
    <h1>🧪 API Test Page</h1>
    
    <h2>1. Register New User</h2>
    <input type="text" id="regUsername" placeholder="Username" value="Test User">
    <input type="email" id="regEmail" placeholder="Email" value="test@test.com">
    <input type="password" id="regPassword" placeholder="Password" value="test123">
    <button onclick="testRegister()">Register</button>
    <div id="regResult" class="result"></div>

    <hr>

    <h2>2. Login</h2>
    <input type="email" id="loginEmail" placeholder="Email" value="test@test.com">
    <input type="password" id="loginPassword" placeholder="Password" value="test123">
    <button onclick="testLogin()">Login</button>
    <div id="loginResult" class="result"></div>

    <hr>

    <h2>3. Get Products (No Auth)</h2>
    <button onclick="testProducts()">Get Products</button>
    <div id="productsResult" class="result"></div>

    <hr>

    <h2>4. Get Cart (With Auth)</h2>
    <button onclick="testCart()">Get Cart</button>
    <div id="cartResult" class="result"></div>

    <script>
        const API_BASE = "http://localhost/WEB-FULLSTACK-Fising.Store/BACKEND/index.php/";
        let userToken = localStorage.getItem("user_token") || "";

        // Helper function to display results
        function displayResult(elementId, data, isError = false) {
            const el = document.getElementById(elementId);
            el.className = "result " + (isError ? "error" : "success");
            el.innerHTML = "<pre>" + JSON.stringify(data, null, 2) + "</pre>";
        }

        // 1. TEST REGISTER
        async function testRegister() {
            const data = {
                username: document.getElementById("regUsername").value,
                email: document.getElementById("regEmail").value,
                password: document.getElementById("regPassword").value
            };

            console.log("🔵 Sending REGISTER request:", data);

            try {
                const response = await fetch(API_BASE + "register", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(data)
                });

                const result = await response.json();
                console.log("✅ Register Response:", result);
                
                displayResult("regResult", {
                    status: response.status,
                    response: result
                }, !response.ok);

            } catch (error) {
                console.error("❌ Register Error:", error);
                displayResult("regResult", { error: error.message }, true);
            }
        }

        // 2. TEST LOGIN
        async function testLogin() {
            const data = {
                email: document.getElementById("loginEmail").value,
                password: document.getElementById("loginPassword").value
            };

            console.log("🔵 Sending LOGIN request:", data);

            try {
                const response = await fetch(API_BASE + "login", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(data)
                });

                const result = await response.json();
                console.log("✅ Login Response:", result);

                if (response.ok && result.data && result.data.token) {
                    userToken = result.data.token;
                    localStorage.setItem("user_token", userToken);
                    console.log("💾 Token saved:", userToken.substring(0, 20) + "...");
                }
                
                displayResult("loginResult", {
                    status: response.status,
                    response: result
                }, !response.ok);

            } catch (error) {
                console.error("❌ Login Error:", error);
                displayResult("loginResult", { error: error.message }, true);
            }
        }

        // 3. TEST GET PRODUCTS (No Auth)
        async function testProducts() {
            console.log("🔵 Getting PRODUCTS (public)");

            try {
                const response = await fetch(API_BASE + "products");
                const result = await response.json();
                console.log("✅ Products Response:", result);
                
                displayResult("productsResult", {
                    status: response.status,
                    count: result.data?.length || 0,
                    products: result.data?.slice(0, 2) || [] // First 2 products
                }, !response.ok);

            } catch (error) {
                console.error("❌ Products Error:", error);
                displayResult("productsResult", { error: error.message }, true);
            }
        }

        // 4. TEST GET CART (With Auth)
        async function testCart() {
            console.log("🔵 Getting CART (protected)");
            console.log("🔑 Using token:", userToken.substring(0, 20) + "...");

            try {
                const response = await fetch(API_BASE + "cart", {
                    headers: { 
                        "Authentication": userToken,
                        "Content-Type": "application/json"
                    }
                });
                
                const result = await response.json();
                console.log("✅ Cart Response:", result);
                
                displayResult("cartResult", {
                    status: response.status,
                    response: result
                }, !response.ok);

            } catch (error) {
                console.error("❌ Cart Error:", error);
                displayResult("cartResult", { error: error.message }, true);
            }
        }

        // On load
        window.onload = function() {
            if (userToken) {
                console.log("✅ Token found in localStorage:", userToken.substring(0, 20) + "...");
            } else {
                console.log("⚠️ No token in localStorage");
            }
        }
    </script>
</body>
</html>
