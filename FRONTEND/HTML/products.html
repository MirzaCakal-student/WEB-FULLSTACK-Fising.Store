<div class="container py-4">

  <h2 class="page-title mb-4 text-success">Our Products</h2>

  <!-- Search & Filter -->
  <div class="row g-3 mb-3">
    <div class="col-md-6">
      <div class="search-box position-relative">
        <i class="bi bi-search"></i>
        <input id="prod-search" class="form-control" placeholder="Search products…">
      </div>
    </div>
    <div class="col-md-6">
      <select id="prod-category" class="form-select category-filter">
        <option value="">All Categories</option>
        <option value="Rods">Rods</option>
        <option value="Reels">Reels</option>
        <option value="Lines">Lines</option>
        <option value="Baits">Baits</option>
        <option value="Accessories">Accessories</option>
      </select>
    </div>
  </div>

  <!-- Sort & Count -->
  <div class="d-flex justify-content-between align-items-center mb-3">
    <span id="prod-count" class="text-muted">Showing 0 products</span>
    <select id="prod-sort" class="form-select form-select-sm" style="width:auto;">
      <option value="name-asc">Name (A–Z)</option>
      <option value="name-desc">Name (Z–A)</option>
      <option value="price-asc">Price (Low → High)</option>
      <option value="price-desc">Price (High → Low)</option>
    </select>
  </div>

  <!-- Grid -->
  <div id="productsContainer" class="row gy-4"></div>

  <!-- No results -->
  <div id="prod-empty" class="text-center py-5 d-none">
    <i class="bi bi-inbox" style="font-size:4rem; color:#ccc;"></i>
    <h4 class="mt-3 text-muted">No products found</h4>
    <p class="text-muted">Try adjusting your search or filters.</p>
  </div>
</div>

<!-- Single Product Modal -->
<div class="modal fade" id="productModal" tabindex="-1">
  <div class="modal-dialog modal-lg modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header bg-primary text-white">
        <h5 id="modalProductName" class="modal-title">Product Details</h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
      </div>
      <div id="modalProductContent" class="modal-body"></div>
    </div>
  </div>
</div>

<!-- Image Zoom Modal -->
<div class="modal fade" id="imageModal" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered modal-xl">
    <div class="modal-content bg-transparent border-0">
      <div class="modal-body text-center p-0">
        <button type="button" class="btn-close btn-close-white position-absolute top-0 end-0 m-3" data-bs-dismiss="modal" style="z-index:1060;"></button>
        <img id="modalImage" src="" class="img-fluid rounded" alt="" style="max-height:90vh;">
      </div>
    </div>
  </div>
</div>

<script>
  // Kick off when this view becomes visible (SPApp loads the fragment)
  (function initProductsView(){
    // tiny guard so we don’t double-bind on SPA revisits
    if (window.__productsBound) return;
    window.__productsBound = true;

    document.getElementById('prod-search')?.addEventListener('input', filterProducts);
    document.getElementById('prod-category')?.addEventListener('change', filterProducts);
    document.getElementById('prod-sort')?.addEventListener('change', sortProducts);

    // load from backend
    fetchProductsFromBackend();
  })();
</script>
